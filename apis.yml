name: HUM Industries
description: >-
  HUM Industries is a consumer hardware company building a wearable AI assistant designed to
  enhance social presence. The device records conversations locally, maintains a rolling buffer
  of recent audio, and surfaces contextual information such as names, personal details, and
  commitments back to the wearer through subtle audio cues. The company frames the product as
  giving people "the freedom to forget" by offloading memory to the device so they can stay
  present in the moment. At the time of profiling the product is pre-launch, offered through a
  preorder waitlist, with no public API, developer portal, or third-party integration surface.
  Backed by a16z; added to the API Evangelist network as a portfolio lead.
